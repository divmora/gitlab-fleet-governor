version: "2"

# CI (divmora/.github go-ci.yml) runs the latest golangci-lint v2, which picks up this file.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    staticcheck:
      checks:
        - all
        # Stylistic: prefer fmt.Fprintf over WriteString(fmt.Sprintf(...)). Not worth the churn.
        - -QF1012
        # Defaults disabled upstream (package comments, dot imports, naming initialisms, error-string capitalisation).
        - -ST1000
        - -ST1001
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    presets:
      # Ignore unchecked errors from Close, fmt.Fprint* and similar calls whose errors are conventionally discarded.
      - std-error-handling
      - common-false-positives
