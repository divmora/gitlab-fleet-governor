apiVersion: v1
kind: Secret
metadata:
  name: gitlab-fleet-governor-secret
  namespace: gitlab-fleet-governor
  labels:
    app.kubernetes.io/name: gitlab-fleet-governor
    app.kubernetes.io/component: governance-engine
    app.kubernetes.io/part-of: fleet-governance
type: Opaque
stringData:
  # Required: Scoped GitLab Personal Access Token or Group Access Token (scope: api or read_api)
  GITLAB_TOKEN: "<YOUR_GITLAB_ACCESS_TOKEN>"

  # Optional: Base URL for self-managed instances (default: https://gitlab.com/api/v4)
  GITLAB_BASE_URL: "https://gitlab.com/api/v4"

  # Optional: SMTP credentials for automated email dispatches of audit reports
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
  SMTP_TO: ""
  SMTP_CC: ""
  SMTP_BCC: ""

  # Optional: Commercial enterprise license key (required if governing >25 projects in production).
  DIVMORA_LICENSE_KEY: ""
