apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-fleet-governor
  namespace: default
  labels:
    app.kubernetes.io/name: gitlab-fleet-governor
    app.kubernetes.io/component: governance-engine
    app.kubernetes.io/part-of: fleet-governance
  annotations:
    # Optional: AWS IRSA annotation if fetching S3 configuration policies
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/gitlab-fleet-governor-irsa
    # Optional: GCP Workload Identity annotation
    # iam.gke.io/gcp-service-account: gitlab-fleet-governor@PROJECT_ID.iam.gserviceaccount.com
