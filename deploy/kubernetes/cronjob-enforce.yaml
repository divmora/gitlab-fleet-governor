apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-fleet-governor-enforce
  namespace: default
  labels:
    app.kubernetes.io/name: gitlab-fleet-governor
    app.kubernetes.io/component: governance-reconciler
    app.kubernetes.io/part-of: fleet-governance
spec:
  # Run every 6 hours
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitlab-fleet-governor
            app.kubernetes.io/component: governance-reconciler
        spec:
          serviceAccountName: gitlab-fleet-governor
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: governor-reconciler
              image: ghcr.io/divmora/gitlab-fleet-governor:latest
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/gitlab-fleet-governor
                - run
                - --config=/etc/gitlab-fleet-governor/policy.yaml
                - --dry-run=false
                - --report-format=json
                - --log-format=json
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: GITLAB_TOKEN
                - name: GITLAB_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: GITLAB_BASE_URL
                      optional: true
                # Optional commercial license key (required for production runs governing >25 projects)
                - name: FLEET_LICENSE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: FLEET_LICENSE_KEY
                      optional: true
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              volumeMounts:
                - name: config-volume
                  mountPath: /etc/gitlab-fleet-governor
                  readOnly: true
                - name: tmp-dir
                  mountPath: /tmp
          volumes:
            - name: config-volume
              configMap:
                name: gitlab-fleet-governor-policy
                items:
                  - key: policy.yaml
                    path: policy.yaml
            - name: tmp-dir
              emptyDir: {}
