apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-fleet-governor-audit
  namespace: default
  labels:
    app.kubernetes.io/name: gitlab-fleet-governor
    app.kubernetes.io/component: audit-engine
    app.kubernetes.io/part-of: fleet-governance
spec:
  # Run every night at 01:00 AM UTC
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600 # 1 hour execution timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitlab-fleet-governor
            app.kubernetes.io/component: audit-engine
        spec:
          serviceAccountName: gitlab-fleet-governor
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: governor-audit
              image: ghcr.io/divmora/gitlab-fleet-governor:latest
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/gitlab-fleet-governor
                - audit
                - --config=/etc/gitlab-fleet-governor/policy.yaml
                - --format=table
                - --output-file=/reports/fleet-audit.xlsx
                - --log-format=json
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: GITLAB_TOKEN
                - name: GITLAB_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: GITLAB_BASE_URL
                      optional: true
                # Optional SMTP configuration for automated email dispatches
                - name: SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_HOST
                      optional: true
                - name: SMTP_PORT
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_PORT
                      optional: true
                - name: SMTP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_USERNAME
                      optional: true
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_PASSWORD
                      optional: true
                - name: SMTP_FROM
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_FROM
                      optional: true
                - name: SMTP_TO
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_TO
                      optional: true
                - name: SMTP_CC
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_CC
                      optional: true
                - name: SMTP_BCC
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: SMTP_BCC
                      optional: true
                # Optional commercial license key (required for production audit of >25 projects)
                - name: FLEET_LICENSE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-fleet-governor-secret
                      key: FLEET_LICENSE_KEY
                      optional: true
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              volumeMounts:
                - name: config-volume
                  mountPath: /etc/gitlab-fleet-governor
                  readOnly: true
                - name: tmp-dir
                  mountPath: /tmp
                - name: reports-dir
                  mountPath: /reports
          volumes:
            - name: config-volume
              configMap:
                name: gitlab-fleet-governor-policy
                items:
                  - key: policy.yaml
                    path: policy.yaml
            - name: tmp-dir
              emptyDir: {}
            - name: reports-dir
              emptyDir: {}
