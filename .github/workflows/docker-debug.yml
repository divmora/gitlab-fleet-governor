name: Docker Debug Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'Dockerfile*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-debug.yml'
  workflow_dispatch:

concurrency:
  group: docker-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-debug:
    name: Build & Push Debug Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for CLI container
      - name: Extract Docker metadata (CLI)
        id: meta_cli
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/debug
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=branch

      # Build and push CLI debug image (multi-arch)
      - name: Build & Push CLI Debug Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_cli.outputs.tags }}
          labels: ${{ steps.meta_cli.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=debug-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta_cli.outputs.created }}

      # Extract metadata for Lambda container
      - name: Extract Docker metadata (Lambda)
        id: meta_lambda
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/debug-lambda
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=branch

      # Build and push Lambda debug image (multi-arch)
      - name: Build & Push Lambda Debug Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_lambda.outputs.tags }}
          labels: ${{ steps.meta_lambda.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=debug-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta_lambda.outputs.created }}

      # Smoke Test / Container Verification
      - name: Smoke Test Built CLI Container
        run: |
          docker pull ghcr.io/${{ github.repository }}/debug:latest
          docker run --rm ghcr.io/${{ github.repository }}/debug:latest --help
          docker run --rm ghcr.io/${{ github.repository }}/debug:latest version --json
