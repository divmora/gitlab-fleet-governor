name: CI/CD

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*', 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA'
        required: false
        type: string
      tag_name:
        description: 'Tag Name'
        required: false
        type: string

# What the shared workflow's jobs need: read the code, push the images.
permissions:
  contents: read
  packages: write

jobs:
  ci-cd:
    uses: divmora/.github/.github/workflows/docker-publish.yml@main
    with:
      enable-go-quality: true
      go-version: '1.27'
      enable-lambda: true
      sha: ${{ inputs.sha || '' }}
      tag_name: ${{ inputs.tag_name || '' }}
    secrets: inherit
