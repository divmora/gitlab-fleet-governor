name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # Static Analysis & Linting
  # ============================================================================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Verify Module Cleanliness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ============================================================================
  # Test Matrix across OS & Go Versions
  # ============================================================================
  test:
    name: Test (${{ matrix.os }} - Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go-version:
          - '1.25.x'
          - '1.26.x'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests with Race Detector and Coverage
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage Profile
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.txt

  # ============================================================================
  # Cross-Platform Binary Build Verification
  # ============================================================================
  build-check:
    name: Cross-Build Verification (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify CLI Compilation
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
          go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/gitlab-fleet-governor

      - name: Verify Lambda Bootstrap Compilation (Linux only)
        if: matrix.target.goos == 'linux'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.target.goarch }} \
          go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/gitlab-fleet-governor
