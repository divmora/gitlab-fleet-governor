name: Deploy GitLab Fleet Governor Studio & Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # Build Documentation & Interactive Studio Bundle
  # ============================================================================
  build:
    name: Build Studio & Documentation Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ui/package.json'

      - name: Install UI Dependencies & Bundle Portal
        run: |
          npm install --prefix ui
          node scripts/build-site.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ============================================================================
  # Deploy Artifact to GitHub Pages
  # ============================================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
